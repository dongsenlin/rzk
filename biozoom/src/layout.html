<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#103c54">
  <meta property="og:site_name" content="BIOZOOM">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{origin}}/assets/hero-panorama-v4.webp">
  <meta property="og:image:width" content="2019">
  <meta property="og:image:height" content="779">
  <meta property="og:image:alt" content="Illustrative BIOZOOM biogas facility beside a green pond with trees and treatment tanks.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{origin}}/assets/hero-panorama-v4.webp">
  <meta name="twitter:image:alt" content="Illustrative BIOZOOM biogas facility beside a green pond with trees and treatment tanks.">
  {{schemaOrganization}}
  {{schemaBreadcrumb}}
  <link rel="icon" type="image/svg+xml" href="/assets/official-emblem.svg">
  <link rel="preload" href="/assets/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
  {{headExtra}}
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
{{> icons}}
<a class="skip-link" href="#main">Skip to main content</a>
{{> header}}

{{content}}

{{> footer}}
</body>
</html>
